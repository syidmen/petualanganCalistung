<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilih Dunia — Petualangan Calistung</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pilih-dunia.css" />
  </head>
  <body>
    <main class="game-screen world-screen" aria-labelledby="world-title">
      <svg class="world-landscape" viewBox="0 0 1133 744" fill="none" aria-hidden="true">
        <g fill="#fff">
          <path d="M80 245c-3-20 11-31 27-29 10-24 40-22 50-5 23-8 42 8 39 28 24 7 19 36-2 36H91c-23 0-25-22-11-30Z" />
          <path d="M943 275c-4-18 13-28 29-20 9-29 45-28 55-7 7 12 6 25-2 34 27 8 20 35-1 35h-81c-23 0-24-31 0-33Z" />
        </g>
        <path d="M0 605c148-58 332-31 513-4 249 36 440 13 620-22v165H0Z" fill="#4BC87F" />
        <path d="M0 684c205-53 393-22 587 5 216 29 405 5 546-24v79H0Z" fill="#30AF6D" />
        <path d="M0 731c264-13 411-2 616 3 224 4 380 6 517-6v16H0Z" fill="#279D61" />
      </svg>
      <div class="world-decoration" aria-hidden="true">
        <span class="world-letter">A</span>
        <span class="world-number">2</span>
      </div>

      <h1 id="world-title" class="world-title">Ayo Pilih Petualanganmu!</h1>

      <button class="back-button" type="button" aria-label="Kembali (tampilan saja)">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="m22 10-10 10 10 10M13 20h18" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>

      <!-- Ikon suara merupakan elemen visual, tanpa aksi. -->
      <button class="sound-button" type="button" aria-label="Suara (tampilan saja)">
        <svg viewBox="0 0 80 88" fill="none" aria-hidden="true">
          <path d="M14 34h15l20-16v52L29 54H14Z" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
          <path d="M58 31q12 13 0 26M66 22q20 22 0 44" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
        </svg>
      </button>

      <section class="world-cards" aria-label="Pilihan dunia">
        <article class="world-card" aria-labelledby="forest-title">
          <svg class="world-illustration" viewBox="0 0 200 172" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="194" height="166" rx="18" fill="#DCF3E2" stroke="#4BC87F" stroke-width="5" />
            <ellipse cx="99" cy="154" rx="77" ry="12" fill="#4BC87F" />
            <path d="M43 92h11v57H43zM111 73h13v76h-13z" fill="#29668B" />
            <circle cx="48" cy="90" r="31" fill="#299B60" />
            <circle cx="118" cy="69" r="41" fill="#4BC87F" stroke="#299B60" stroke-width="5" />
            <text x="118" y="83" text-anchor="middle" fill="white" class="illustration-letter" font-size="45">A</text>
          </svg>
          <h2 id="forest-title">Hutan Huruf</h2>
          <p class="world-subject">Membaca</p>
          <p class="world-progress" aria-label="0 dari 5"><svg class="progress-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .9-5.2 5 1.3 7.1L12 18l-6.1 3.5 1.3-7.1L2 9.4l7-.9Z" fill="#F0F87F" stroke="#29668B" stroke-width="2.2" stroke-linejoin="round" /></svg><span>0/5</span></p>
        </article>

        <article class="world-card" aria-labelledby="pencil-title">
          <svg class="world-illustration" viewBox="0 0 200 172" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="194" height="166" rx="18" fill="#FCFBCF" stroke="#C2CF3C" stroke-width="5" />
            <path d="M31 145q41-24 70 2t66-4" stroke="#29668B" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 10" />
            <g stroke="#29668B" stroke-width="4.5" stroke-linejoin="round">
              <path d="m32 139-12-19 104-71 15 22Z" fill="#F0F87F" />
              <path d="m124 49 37-10-22 32Z" fill="#fff" />
              <path d="m150 42 11-3-7 10Z" fill="#29668B" />
              <path d="m20 120 11-7 13 19-12 7Z" fill="#4BC87F" />
              <path d="m31 113 10-7 14 19-11 7Z" fill="#6EAFF7" />
            </g>
          </svg>
          <h2 id="pencil-title">Taman Pensil</h2>
          <p class="world-subject">Menulis</p>
          <p class="world-progress" aria-label="0 dari 5"><svg class="progress-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .9-5.2 5 1.3 7.1L12 18l-6.1 3.5 1.3-7.1L2 9.4l7-.9Z" fill="#F0F87F" stroke="#29668B" stroke-width="2.2" stroke-linejoin="round" /></svg><span>0/5</span></p>
        </article>

        <article class="world-card" aria-labelledby="numbers-title">
          <svg class="world-illustration" viewBox="0 0 200 172" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="194" height="166" rx="18" fill="#D6E9FF" stroke="#6EAFF7" stroke-width="5" />
            <g stroke="#29668B" stroke-width="4.5" stroke-linejoin="round">
              <path d="M19 106h46v43H19Zm116 0h46v43h-46Z" fill="#fff" />
              <path d="M65 63h70v86H65Z" fill="#fff" />
              <path d="m14 106 27-26 28 26Zm117 0 27-26 28 26Z" fill="#4BC87F" />
              <path d="m55 63 45-41 45 41Z" fill="#F0F87F" />
              <path d="M87 149v-22a13 13 0 0 1 26 0v22Z" fill="#29668B" />
            </g>
            <text x="100" y="97" text-anchor="middle" fill="#29668B" class="illustration-letter" font-size="30">1</text>
          </svg>
          <h2 id="numbers-title">Kerajaan Angka</h2>
          <p class="world-subject">Berhitung</p>
          <p class="world-progress" aria-label="0 dari 5"><svg class="progress-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.5 7 .9-5.2 5 1.3 7.1L12 18l-6.1 3.5 1.3-7.1L2 9.4l7-.9Z" fill="#F0F87F" stroke="#29668B" stroke-width="2.2" stroke-linejoin="round" /></svg><span>0/5</span></p>
        </article>
      </section>

      <svg class="world-mascot" viewBox="0 0 140 140" fill="none" aria-hidden="true">
        <g stroke="#29668B" stroke-width="3" stroke-linejoin="round">
          <path d="m30 44 3-24 22 12m30 0 22-12 3 24" fill="#F0F87F" />
          <ellipse cx="53" cy="129" rx="12" ry="5" fill="#4BC87F" />
          <ellipse cx="87" cy="129" rx="12" ry="5" fill="#4BC87F" />
          <ellipse cx="70" cy="77" rx="46" ry="51" fill="#F0F87F" />
          <ellipse cx="70" cy="93" rx="33" ry="33" fill="#fff" stroke="none" />
          <ellipse cx="22" cy="88" rx="11" ry="27" transform="rotate(12 22 88)" fill="#4BC87F" />
          <ellipse cx="118" cy="88" rx="11" ry="27" transform="rotate(-12 118 88)" fill="#4BC87F" />
          <circle cx="51" cy="66" r="17" fill="#fff" />
          <circle cx="89" cy="66" r="17" fill="#fff" />
          <path d="m65 80 5 11 5-11Z" fill="#F0F87F" stroke-width="2" />
        </g>
        <ellipse cx="53" cy="67" rx="6" ry="8" fill="#1F4A63" />
        <ellipse cx="87" cy="67" rx="6" ry="8" fill="#1F4A63" />
        <circle cx="55" cy="63" r="2.5" fill="#fff" />
        <circle cx="89" cy="63" r="2.5" fill="#fff" />
        <circle cx="35" cy="81" r="6" fill="#6EAFF7" />
        <circle cx="105" cy="81" r="6" fill="#6EAFF7" />
      </svg>
      <p class="world-prompt">Mau main di dunia mana?</p>
    </main>
  </body>
</html>
